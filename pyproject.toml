[project]
name = "cortago"
version = "0.3.0"
description = "Gera Shorts automaticamente a partir de vídeos longos"
readme = "README.md"
authors = [
    { name = "Murilo Teshima", email = "muriloteshimalira@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.163.0",
    "faster-whisper>=1.2.1",
    "jinja2>=3.1.6",
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "rich>=15.0.0",
    "sqlmodel>=0.0.50",
    "typer>=0.29.1",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
cortago = "cortago.cli:app"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # o formatter cuida do tamanho das linhas; strings longas são aceitas

[tool.pytest.ini_options]
testpaths = ["tests"]
